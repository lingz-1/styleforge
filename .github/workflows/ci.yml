name: CI

on:
  push:
  pull_request:

concurrency:
  group: styleforge-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: styleforge
          POSTGRES_PASSWORD: styleforge
          POSTGRES_DB: styleforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U styleforge -d styleforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STYLEFORGE_DATABASE_DSN: postgresql://styleforge:styleforge@127.0.0.1:5432/styleforge_test
      STYLEFORGE_TEST_DATABASE_DSN: postgresql://styleforge:styleforge@127.0.0.1:5432/styleforge_test
      STYLEFORGE_E2E_DATABASE_DSN: postgresql://styleforge:styleforge@127.0.0.1:5432/styleforge_test
      STYLEFORGE_REDIS_ENABLED: "false"
      STYLEFORGE_LLM_ENABLED: "false"
      STYLEFORGE_VISION_ENABLED: "false"
      STYLEFORGE_WEATHER_ENABLED: "false"
      STYLEFORGE_WEB_SEARCH_ENABLED: "false"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Python dependencies
        run: >-
          python -m pip install -e
          ".[api,agents,llm-openai,db,cache,rag,images,orders,mcp,dev]"

      - name: Ruff
        run: |
          python -m ruff --version
          python -m ruff check apps/api/styleforge tests evals scripts --output-format=github

      - name: Pytest
        shell: bash
        run: |
          mkdir -p .ci-tmp
          set -o pipefail
          python -m pytest -q --tb=short --basetemp .ci-tmp/pytest 2>&1 \
            | tee .ci-tmp/pytest.log

      - name: Report Pytest failure
        if: failure()
        shell: bash
        run: |
          if [[ -s .ci-tmp/pytest.log ]]; then
            missing_modules="$(sed -nE \
              "s/.*ModuleNotFoundError: No module named '([A-Za-z0-9_.-]+)'.*/\1/p" \
              .ci-tmp/pytest.log | sort -u | paste -sd, -)"
            collection_files="$(sed -nE \
              's/^ERROR collecting ([A-Za-z0-9_./-]+).*/\1/p' \
              .ci-tmp/pytest.log | sort -u | paste -sd, -)"
            message="Pytest exited unsuccessfully."
            if [[ -n "$missing_modules" ]]; then
              message="$message Missing modules: $missing_modules."
            fi
            if [[ -n "$collection_files" ]]; then
              message="$message Collection errors: $collection_files."
            fi
            echo "::error title=Pytest failure::$message"
          fi

      - name: Lightweight wardrobe quality benchmark
        run: >-
          python -m evals.runners.evaluate_wardrobe_quality
          --mode deterministic
          --report .ci-tmp/wardrobe-quality-lightweight.json

      - name: API health smoke
        shell: bash
        run: |
          python tests/e2e/run_api.py >.ci-tmp/api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health >.ci-tmp/health.json; then
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat .ci-tmp/api.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18000/health | python -m json.tool

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Test web
        working-directory: apps/web
        run: npm test

      - name: Build web
        working-directory: apps/web
        run: npm run build

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ci-diagnostics
          path: .ci-tmp/
          if-no-files-found: ignore
