global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: styleforge
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: styleforge-api
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.json
        refresh_interval: 30s
